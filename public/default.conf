server {
    listen       5173;
    listen  [::]:5173;
    server_name  localhost;
    location / {
        root   /app;
        index  index.html index.htm;
        # 前端路由（/repeater、/analysis、/gallery 等）直接访问或刷新时，
        # 交回 index.html 由前端接管，否则 nginx 找不到同名文件会返回 404
        try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
}
